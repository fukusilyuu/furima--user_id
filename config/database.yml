default: &default
  adapter: mysql2
  encoding: utf8
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: root
  password: 
  socket: /tmp/mysql.sock


development:
  <<: *default
  database: furima_user_id_development


# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: furima_user_id_test


production:
  <<: *default
  database: furima_user_id_production
  username: furima_user_id
  password: <%= ENV["FURIMA_USER_ID_DATABASE_PASSWORD"] %>

